name: Mobile CI/CD (Android & iOS)

# Manually triggered: pick the environment (and optionally the platform) from
# the "Run workflow" button on the Actions tab.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment / build flavour"
        type: choice
        required: true
        options:
          - UAT
          - Stage
          - Prod
      platform:
        description: "Which platform(s) to build"
        type: choice
        required: true
        default: both
        options:
          - android
          - ios
          - both
      bump:
        description: "Version part to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

# Only one run per environment at a time (prevents two Prod builds racing
# on the same VERSION file / tag).
concurrency:
  group: mobile-ci-cd-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  CSPROJ_PATH: "DashboardMauiApp/DashboardMauiApp.csproj"
  ENVIRONMENT: ${{ github.event.inputs.environment }}

jobs:
  # ---------------------------------------------------------------------
  # 1) Bump the version, commit it back to the branch, tag the release.
  #    Every downstream job reads its outputs, so Android/iOS/whatever
  #    gets built always carries the SAME version + build number.
  # ---------------------------------------------------------------------
  version-bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build_number: ${{ steps.bump.outputs.build_number }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN can push commits/tags back to the repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "VERSION file not found at repo root, creating it with 1.0.0"
            echo "1.0.0" > VERSION
          fi
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          BUILD_NUMBER="${{ github.run_number }}"
          TAG="v${NEW_VERSION}-${{ github.event.inputs.environment }}.${BUILD_NUMBER}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $NEW_VERSION (build $BUILD_NUMBER, tag $TAG)"

      - name: Commit & tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} (${{ github.event.inputs.environment }}) [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"

  # ---------------------------------------------------------------------
  # 2) Android build
  # ---------------------------------------------------------------------
  build-android:
    needs: version-bump
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (post version-bump commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: |
          dotnet workload restore
          dotnet workload install maui-android

      - name: Restore Android
        run: |
          dotnet restore ${{ env.CSPROJ_PATH }} \
            -p:TargetFramework=net8.0-android

      - name: Verify Keystore
        run: |
            echo "Workspace: $GITHUB_WORKSPACE"
            ls -la
            ls -la keystore
            test -f "$GITHUB_WORKSPACE/keystore/release.keystore" && echo "Keystore found" || echo "Keystore NOT found"

      - name: Build Signed Android
        run: |
          dotnet publish ${{ env.CSPROJ_PATH }} \
            --no-restore \
            -c ${{ env.ENVIRONMENT }} \
            -f net8.0-android \
            -p:ApplicationDisplayVersion=${{ needs.version-bump.outputs.version }} \
            -p:ApplicationVersion=${{ needs.version-bump.outputs.build_number }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ github.workspace }}/keystore/release.keystore \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseSharedRuntime=false \
            -p:EmbedAssembliesIntoApk=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Optimize=true \
            -o ./artifacts/android
          
      - name: Build Signed Android AAB
        run: |
          dotnet publish ${{ env.CSPROJ_PATH }} \
            --no-restore \
            -c ${{ env.ENVIRONMENT }} \
            -f net8.0-android \
            -p:ApplicationDisplayVersion=${{ needs.version-bump.outputs.version }} \
            -p:ApplicationVersion=${{ needs.version-bump.outputs.build_number }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ github.workspace }}/keystore/release.keystore \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidPackageFormat=aab \
            -p:AndroidUseSharedRuntime=false \
            -p:Optimize=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./artifacts/android-aab
          
      - name: Verify APK
        run: |
          APK=$(find ./artifacts/android -name "*.apk" | head -1)
          echo "APK = $APK"
          unzip -l "$APK" | grep assemblies || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.ENVIRONMENT }}-${{ needs.version-bump.outputs.version }}
          path: ./artifacts/android/**/*.apk
          if-no-files-found: error
          
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ env.ENVIRONMENT }}-${{ needs.version-bump.outputs.version }}
          path: ./artifacts/android-aab/**/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 3) iOS build (must run on a macOS runner)
  # ---------------------------------------------------------------------
  build-ios:
    needs: version-bump
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-14
    steps:
      - name: Checkout (post version-bump commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: .NET Info
        run: dotnet --info

      - name: Install MAUI iOS workload
        run: |
          dotnet workload restore
          dotnet workload install maui-ios

      - name: Restore iOS
        run: |
          dotnet restore ${{ env.CSPROJ_PATH }} \
            -p:TargetFramework=net8.0-ios

      # --- Signing --------------------------------------------------------
      # Repo secrets: IOS_CERTIFICATE_BASE64 (.p12), IOS_CERTIFICATE_PASSWORD,
      # IOS_PROVISIONING_PROFILE_BASE64 (.mobileprovision).
      # The certificate goes into a throw-away keychain that is deleted at
      # the end of the job, even when the build fails.
      - name: Check signing secrets
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -z "$CERT_B64" ]    && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$CERT_PASS" ]   && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE_B64" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            exit 1
          fi

      - name: Install certificate and provisioning profile
        id: signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASS"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Read what the profile contains, then install it.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          # Signing identity name straight from the imported certificate.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::No code-signing identity found in the .p12"; exit 1; }

          echo "Profile: $PROFILE_NAME ($PROFILE_APPID, team $PROFILE_TEAM)"
          echo "Identity: $IDENTITY"
          {
            echo "keychain=$KEYCHAIN"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_appid=$PROFILE_APPID"
            echo "team=$PROFILE_TEAM"
            echo "identity=$IDENTITY"
          } >> "$GITHUB_OUTPUT"

      # The profile only works for the bundle id it was created for. Fail early
      # with a clear message instead of a cryptic Xcode signing error.
      - name: Check profile matches the app's bundle id
        env:
          PROFILE_APPID: ${{ steps.signing.outputs.profile_appid }}
          TEAM: ${{ steps.signing.outputs.team }}
        run: |
          BUNDLE_ID=$(dotnet msbuild ${{ env.CSPROJ_PATH }} \
            -p:Configuration=${{ env.ENVIRONMENT }} -p:TargetFramework=net8.0-ios \
            -getProperty:ApplicationId | tr -d '[:space:]')
          echo "App bundle id : $BUNDLE_ID"
          echo "Profile app id: $PROFILE_APPID"
          case "$PROFILE_APPID" in
            "$TEAM.$BUNDLE_ID"|"$TEAM.*") echo "Profile matches." ;;
            *)
              echo "::error::Profile is for '$PROFILE_APPID' but the ${{ env.ENVIRONMENT }} build uses bundle id '$BUNDLE_ID'. Upload a profile for that App ID, or change ApplicationId in the csproj."
              exit 1 ;;
          esac

      - name: Build signed IPA
        run: |
          dotnet publish ${{ env.CSPROJ_PATH }} \
            --no-restore \
            -c ${{ env.ENVIRONMENT }} \
            -f net8.0-ios \
            -p:ApplicationDisplayVersion=${{ needs.version-bump.outputs.version }} \
            -p:ApplicationVersion=${{ needs.version-bump.outputs.build_number }} \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:EnableAssemblyILStripping=false \
            -p:CodesignKey="${{ steps.signing.outputs.identity }}" \
            -p:CodesignProvision="${{ steps.signing.outputs.profile_name }}" \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Optimize=true

      - name: Collect IPA
        run: |
          mkdir -p ./artifacts/ios
          IPA=$(find DashboardMauiApp -name "*.ipa" -path "*ios-arm64*" -print -quit)
          if [ -z "$IPA" ]; then echo "::error::No .ipa produced"; exit 1; fi
          echo "IPA = $IPA"
          cp "$IPA" "./artifacts/ios/DashboardMauiApp-${{ env.ENVIRONMENT }}-${{ needs.version-bump.outputs.version }}.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.ENVIRONMENT }}-${{ needs.version-bump.outputs.version }}
          path: ./artifacts/ios/*.ipa
          if-no-files-found: error

      - name: Remove keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -f "$RUNNER_TEMP/profile.plist"

  # ---------------------------------------------------------------------
  # 4) Summary
  # ---------------------------------------------------------------------
  summary:
    needs: [version-bump, build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ github.event.inputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform(s): **${{ github.event.inputs.platform }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: **${{ needs.version-bump.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build number: **${{ needs.version-bump.outputs.build_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: **${{ needs.version-bump.outputs.tag }}**" >> "$GITHUB_STEP_SUMMARY"
